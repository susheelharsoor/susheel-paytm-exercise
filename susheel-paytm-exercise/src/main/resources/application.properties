server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo_db}
spring.datasource.username=${DB_USERNAME:demo_user}
spring.datasource.password=${DB_PASSWORD:demo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=none — schema.sql owns DDL so the balance >= 0 CHECK is always present.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL init — run schema.sql on every boot (statements are idempotent: IF NOT EXISTS / DO $$)
spring.sql.init.mode=always
# schema.sql uses PostgreSQL-specific syntax; tell the init runner to use the app datasource
spring.sql.init.platform=postgresql

# Actuator — expose only the health endpoint (used by HEALTHCHECK and docker-compose)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
