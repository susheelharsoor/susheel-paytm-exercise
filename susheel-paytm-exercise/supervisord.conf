[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ==========================================
; Process 1: PostgreSQL
; Starts first (lower priority number)
; ==========================================
[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

; ==========================================
; Process 2: Spring Boot app
; Starts after postgres (higher priority number = starts later)
; ==========================================
[program:springapp]
command=java org.springframework.boot.loader.launch.JarLauncher
directory=/app
user=appuser
autostart=true
autorestart=true
priority=20
startsecs=15
stdout_logfile=/var/log/supervisor/springapp.log
stderr_logfile=/var/log/supervisor/springapp_err.log
; Pass through environment variables from the container's runtime environment.
; supervisord strips inherited env by default, so we re-inject them explicitly
; using %(ENV_VAR_NAME)s interpolation so runtime -e overrides are respected.
environment=DB_HOST="%(ENV_DB_HOST)s",DB_PORT="%(ENV_DB_PORT)s",DB_NAME="%(ENV_DB_NAME)s",DB_USERNAME="%(ENV_DB_USERNAME)s",DB_PASSWORD="%(ENV_DB_PASSWORD)s",DDL_AUTO="%(ENV_DDL_AUTO)s",SHOW_SQL="%(ENV_SHOW_SQL)s"
